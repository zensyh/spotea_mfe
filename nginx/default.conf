# ------------------------------------------------------------------
# Nginx reverse proxy — production
# Routes path prefixes to the correct Next.js container in Docker.
# All apps are accessed from http://localhost (port 80).
# ------------------------------------------------------------------

upstream consumer {
    server consumer:3000;
}

upstream merchant {
    server merchant:3001;
}

upstream backoffice {
    server backoffice:3002;
}

server {
    listen 80;
    server_name localhost;

    # ── Merchant zone (/merchant/*) ──
    # Strip /merchant prefix before forwarding so Next.js sees its basePath
    location ^~ /merchant {
        proxy_pass http://merchant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Back Office zone (/backoffice/*) ──
    location ^~ /backoffice {
        proxy_pass http://backoffice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Consumer (root /) — catch-all ──
    location / {
        proxy_pass http://consumer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
