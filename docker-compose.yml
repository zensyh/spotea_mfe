services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      consumer:
        condition: service_started
      merchant:
        condition: service_started
      backoffice:
        condition: service_started

  consumer:
    build:
      context: .
      dockerfile: apps/spotea-consumer/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost
    expose:
      - "3000"

  merchant:
    build:
      context: .
      dockerfile: apps/spotea-merchant/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost
    expose:
      - "3001"

  backoffice:
    build:
      context: .
      dockerfile: apps/spotea-backoffice/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost
    expose:
      - "3002"
